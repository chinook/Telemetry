version: "3"

services:

  influxdb:
    image: influxdb:1.8.1-alpine

    environment:
      - INFLUXDB_DB=eclipsedb_1
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    
      - INFLUXDB_ADMIN_USER=telemetry-admin
      - INFLUXDB_ADMIN_PASSWORD=password

    ports:
      - 8086:8086

    volumes:
      - influxdb-storage:/var/lib/influxdb

  grafana:
    image: grafana/grafana:7.1.5

    ports:
      - 3000:3000

    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/graphana.ini

    depends_on: 
        - influxdb

  inserter:
    build:
      context: ./inserter
    
    image: telemetry:0.1.0

    devices:
      - "/dev/ttyUSB0:/dev/ttyS0"

    depends_on: 
        - influxdb
    

volumes:
  grafana-storage:

  influxdb-storage:
